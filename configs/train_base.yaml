data:
  dataset: Skywork/SkyPile-150B
  split: train
  text_field: text
  tokenizer_path: tokenizer/skypile_4k_tokenizer.json
  streaming: false
  shuffle_buffer_size: 10000
  seed: 20260609
  data_dir: /home/scc/pb24511935/skypile_data

train:
  seq_len: 8192
  precision: bf16
  compile: false
  gradient_checkpointing: true
  flash_attention: true
  micro_batch_size: 1
  grad_accum_steps: 32
  world_size: 2
  global_batch_tokens: 524288
  max_tokens: 3000000000

optimizer:
  name: adamw
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0

scheduler:
  name: cosine
  warmup_tokens: 100000000

logging:
  log_every: 1
  csv_every: 1
  save_every: 500
  keep_last_n_checkpoints: 3

runtime:
  output_dir: runs/default
  resume: true
  num_workers: 0
