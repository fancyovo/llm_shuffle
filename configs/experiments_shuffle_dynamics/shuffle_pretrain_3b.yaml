include:
  model: configs/model_50m.yaml
  train: configs/train_constant_lr.yaml

experiment:
  name: shuffle_pretrain_3b_dynamics
  mode: shuffle
  init_checkpoint: null

train:
  max_tokens: 3000000000

shuffle:
  enabled: true
  permutation_scope: sequence
  preserve_special_tokens: true
  first_permutable_id: 4
  last_permutable_id: 4095

runtime:
  output_dir: runs_shuffle_dynamics/shuffle_pretrain_3b_v2
